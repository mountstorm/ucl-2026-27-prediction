name: Update results

on:
  schedule:
    - cron: "30 22 * * 2,3,4"   # ~30 min after the last kickoff on Champions League nights (UTC)
    - cron: "0 7 * * *"         # daily catch-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch results from ESPN
        id: fetch
        run: python update_results.py

      - name: Rerun the model and rebuild the site
        if: steps.fetch.outputs.changed == 'true'
        run: |
          python predict.py --fixtures data/fixtures.csv --results data/results.csv
          python build_site.py
          python -m unittest discover -s tests

      - name: Commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output site/data.js README.md
          git commit -m "Update results from ESPN ($(python -c 'import json;print(json.load(open("data/source.json"))["results"])') games)"
          git push
