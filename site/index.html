<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <link rel="stylesheet" href="css/app.css">
  <script>
    try { var t = localStorage.getItem('ucl.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}

</head>
<body>
  <header class="bar">
    <div class="wrap bar-in">
      <a class="logo" href="./" aria-label="UCL 2026-27 Odds home">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M8 21l5-5 4 3 7-8" stroke="var(--on-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </span>
        <span class="logo-text">UCL 26/27<br>Odds</span>
      </a>
      <span class="live-pill" id="livePill"></span>
      <div class="bar-actions">
        <button class="round-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>

        <a class="pill-btn" href="https://github.com/mountstorm/ucl-2026-27-prediction">Source</a>
      </div>
    </div>
  </header>

  <main class="wrap" id="app" aria-live="polite"></main>

  <footer class="wrap foot">
    <p>Probabilities from a simulation model, not betting advice. "Yes" and "No" prices are the model's chances written as cents on the dollar. Club colors are used for identification only; no crests or trademarks.</p>
    <p><a href="https://github.com/mountstorm/ucl-2026-27-prediction">Source on GitHub</a></p>
  </footer>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="data.js"></script>
